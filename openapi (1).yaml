    get:
      summary: 列出授权用户的Pull Request列表
      operationId: get_get-api-v-5-users-merge-requests
      tags:
      - Users
      parameters:
      - name: access_token
        in: query
        required: true
        schema:
          type: string
        description: 用户授权码
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: 返回已打开、已关闭、已锁定、已合并或所有合并请求， open：已打开；closed：已关闭；locked：已锁定；merged：已合并；all：所有。默认返回所有的
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: 返回按字段排序的合并请求，创建时间：created；更新时间：updated；合并时间：merged_at。默认按照创建时间排序
      - name: direction
        in: query
        required: false
        schema:
          type: string
        description: 返回按照排序字段升序或者降序的合并请求，desc：降序；asc：升序
      - name: labels
        in: query
        required: false
        schema:
          type: string
        description: 逗号分隔的标签名称
      - name: created_after
        in: query
        required: false
        schema:
          type: string
        description: 返回在指定时间之后创建的合并请求，时间格式为 ISO 8601 例如：2024-11-20T13:00:21+08:00
      - name: created_before
        in: query
        required: false
        schema:
          type: string
        description: 返回在指定时间之前创建的合并请求，时间格式为 ISO 8601 例如：2024-11-20T13:00:21+08:00
      - name: updated_after
        in: query
        required: false
        schema:
          type: string
        description: 返回在指定时间之后更新的合并请求，时间格式为 ISO 8601 例如：2024-11-20T13:00:21+08:00
      - name: updated_before
        in: query
        required: false

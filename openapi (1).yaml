openapi: 3.0.3
info:
  title: AtomGit API
  description: AtomGit平台API接口文档
  version: 5.0.0
servers:
- url: https://api.atomgit.com
  description: AtomGit API 生产服务器
paths:
  /api/v5/org/{owner}/kanban/{kanban_id}/item_list:
    get:
      summary: 查询看板内容列表
      operationId: get_delete-api-v-5-org-owner-kanban-kanban-id-item-list
      tags:
      - API
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
        description: 组织的路径
      - name: kanban_id
        in: path
        required: true
        schema:
          type: string
        description: 看板id
      - name: access_token
        in: query
        required: false
        schema:
          type: string
        description: 用户授权码
      - name: repo
        in: query
        required: false
        schema:
          type: string
        description: 仓库路径
      - name: source_type
        in: query
        required: false
        schema:
          type: string
        description: 来源类型 issue/merge_request
      - name: source_status
        in: query
        required: false
        schema:
          type: string
        description: 来源状态 opened/closed/merged
      - name: title
        in: query
        required: false
        schema:
          type: string
        description: 标题
      - name: source_iids
        in: query
        required: false
        schema:
          type: string
        description: 使用pr或者issue的iid进行查询, 使用该参数必须填写repo参数，否则不生效
      - name: page
        in: query
        required: false
        schema:
          type: string
        description: 分页参数，第几页
      - name: per_page
        in: query
        required: false
        schema:
          type: string
        description: 分页参数，每页数量
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  number:
                    type: integer
                  title:
                    type: string
                  source_type:
                    type: string
                  status:
                    type: string
                  html_url:
                    type: string
                  url:
                    type: string
                  repo:
                    type: object
                  full_name:
                    type: string
                  human_name:
                    type: string
                  name:
                    type: string
                  labels:
                    type: array
                  color:
                    type: string
                  assignees:
                    type: array
                  login:
                    type: string
                  avatar_url:
                    type: string
                  milestone_resp:
                    type: object
                  linked_pull_requests:
                    type: array
                  state:
                    type: string
                  values:
                    type: array
                  field_name:
                    type: string
                  field_type:
                    type: string
                  value:
                    type: string
                  position:
                    type: integer
                  description:
                    type: string
                  reviewers:
                    type: array
      x-doc-link: list/delete-api-v-5-org-owner-kanban-kanban-id-item-list.md
  /org/{owner}/kanban/{kanban_id}/remove_item:
    delete:
      summary: 删除看板关联的Issue或者Pull Request
      operationId: delete_delete-api-v-5-org-owner-kanban-kanban-id-remove-item
      tags:
      - API
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
        description: 组织的路径
      - name: kanban_id
        in: path
        required: true
        schema:
          type: string
        description: 看板id
      - name: access_token
        in: query
        required: false
        schema:
          type: string
        description: 用户授权码
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                issue_pr_iids:
                  type: object
                  description: 要删的issue或者pull request信息
                owner:
                  type: string
                  description: 组织的路径
                repo:
                  type: string
                  description: 仓库的路径
                issue_iids:
                  type: array
                  description: 仓库内issue的iid
                pr_iids:
                  type: array
                  description: 仓库内pull request的iid
              required:
              - issue_pr_iids
              - owner
              - repo
              - issue_iids
              - pr_iids
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  ? ''
                  : type: object
      x-doc-link: list/delete-api-v-5-org-owner-kanban-kanban-id-remove-item.md

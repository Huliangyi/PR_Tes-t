            application/json:
              schema:
                type: object
                properties:
                  ? ''
                  : type: object
      x-doc-link: list/delete-api-v-5-orgs-org-memberships-username.md
    post:
      summary: 邀请组织成员
      operationId: post_post-api-v-5-orgs-org-memberships-username
      tags:
      - Organizations
      parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
        description: 仓库所属空间地址(企业、组织或个人的地址path)
      - name: username
        in: path
        required: true
        schema:
          type: string
        description: 用户名(username/login)
      - name: access_token
        in: query
        required: true
        schema:
          type: string
        description: 用户授权码
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                permission:
                  type: string
                  description: '成员权限: 参与者(pull)，开发者(push)，维护者(admin)，customized(自定义角色)。默认:
                    push'
                role_id:
                  type: string
                  description: 角色ID, 如果permission传入了customized则需要传入角色id
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  followers_url:
                    type: string
                  html_url:
                    type: string
                  id:
                    type: string
                  login:
                    type: string
                  name:
                    type: string
                  type:
                    type: string
                  url:
                    type: string
                  permissions:
                    type: object
                  admin:
                    type: integer
                  customized:
                    type: integer
                  push:
                    type: integer
                  pull:
                    type: integer
      x-doc-link: list/post-api-v-5-orgs-org-memberships-username.md
